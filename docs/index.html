<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jobwatch</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1b1d1f; --mut:#6b7280; --line:#e6e7e9;
  --a:#0f7b4f; --b:#2563a8; --c:#8a8f98; --accent:#16232F; --warn:#b4553e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517; --panel:#1c1e21; --ink:#e8e9ea; --mut:#9aa0a6; --line:#2c2f33;
  --a:#49c08a; --b:#6aa9e9; --c:#7d848d; --accent:#dfe3e8; --warn:#d2795f;
}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:19px;margin:0}
.meta{color:var(--mut);font-size:12.5px;margin-top:4px}
.alert{margin-top:12px;border:1px solid var(--warn);border-left:4px solid var(--warn);border-radius:8px;
  padding:9px 12px;font-size:13px;background:var(--panel)}
.alert:empty{display:none}
.alert b{color:var(--warn)}
.alert a{color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;align-items:center}
.bar input,.bar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font:inherit;font-size:13.5px}
.bar input{flex:1;min-width:170px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.tabs{display:flex;gap:6px;margin:14px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;
  font-size:13px;cursor:pointer;color:var(--mut)}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--ink);font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;margin-bottom:10px}
.card.applied{border-left:3px solid var(--a)}
.card.dismissed{opacity:.5;border-left:3px solid var(--c)}
.card.saved{border-left:3px solid var(--b)}
.row1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tier{font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px;border:1px solid}
.tA{color:var(--a);border-color:var(--a)} .tB{color:var(--b);border-color:var(--b)}
.tC{color:var(--c);border-color:var(--c)}
.title{font-weight:650;font-size:15.5px}
.title a{color:inherit;text-decoration:none}.title a:hover{text-decoration:underline}
.co{color:var(--mut);font-size:13px}
.sub{color:var(--mut);font-size:12.5px;margin-top:5px}
.why{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.w{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.new{font-size:10.5px;background:var(--a);color:#fff;border-radius:5px;padding:2px 6px;font-weight:700}
.dates{color:var(--mut);font-size:12.5px;margin-top:3px}
.dates b{font-weight:600;color:var(--ink)}
.fr{font-size:11px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--mut)}
.fr.up{color:var(--a);border-color:var(--a)} .fr.down{color:var(--warn);border-color:var(--warn)}
.pay{font-weight:650;color:var(--ink)}
.act{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.act button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:7px;
  border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.act button:hover{color:var(--ink);border-color:var(--accent)}
.act button.on{border-color:var(--accent);color:var(--ink);font-weight:650}
.note{font-size:12.5px;color:var(--mut);border:none;background:transparent;flex:1;min-width:140px;
  border-bottom:1px dashed var(--line);padding:3px 2px;font-family:inherit}
.note:focus{outline:none;border-bottom-color:var(--accent);color:var(--ink)}
.stamp{font-size:11.5px;color:var(--mut)}
.empty{color:var(--mut);padding:40px 0;text-align:center}
details{margin-top:22px;color:var(--mut);font-size:12.5px}
.err{color:var(--warn);font-size:12.5px}
.tools{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.tools button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
</style></head>
<body><div class="wrap">
  <h1>jobwatch</h1>
  <div class="meta" id="meta">loading…</div>
  <div class="alert" id="alert" role="status"></div>

  <div class="tabs" id="tabs">
    <button class="tab" data-view="open"      aria-selected="true">Open <span id="c-open"></span></button>
    <button class="tab" data-view="applied"   aria-selected="false">Applied <span id="c-applied"></span></button>
    <button class="tab" data-view="saved"     aria-selected="false">Saved <span id="c-saved"></span></button>
    <button class="tab" data-view="dismissed" aria-selected="false">Not relevant <span id="c-dismissed"></span></button>
    <button class="tab" data-view="review"    aria-selected="false">Review queue <span id="c-review"></span></button>
  </div>

  <div class="bar">
    <input id="q" placeholder="filter by title, company, location…">
    <select id="sort" aria-label="sort">
      <option value="score">sort: fit + freshness</option>
      <option value="fit">sort: best fit (ignore age)</option>
      <option value="pay">sort: highest stated pay</option>
      <option value="posted">sort: newest posted</option>
      <option value="found">sort: newest found</option>
      <option value="company">sort: company</option>
    </select>
    <select id="age" aria-label="newness">
      <option value="">age: any</option>
      <option value="1">new: last 24 hours</option>
      <option value="3">new: last 3 days</option>
      <option value="7">new: last 7 days</option>
      <option value="14">new: last 2 weeks</option>
      <option value="30">new: last 30 days</option>
      <option value="-30">older than 30 days</option>
    </select>
    <button class="chip" id="fA" aria-pressed="true">A</button>
    <button class="chip" id="fB" aria-pressed="true">B</button>
    <button class="chip" id="fC" aria-pressed="false" title="weaker matches: relevant, but low fit, pay or company score">C</button>
  </div>

  <div id="list"></div>

  <div class="tools">
    <button id="exp">Export status</button>
    <button id="imp">Import status</button>
    <button id="clr">Clear all status</button>
    <button id="sync">Sync across devices</button>
    <span class="stamp" id="syncst"></span>
  </div>
  <details id="errbox"></details>
</div>

<script>
const KEY="jobwatch.status.v2";
// id -> {s:"applied"|"saved"|"dismissed", t:when marked, n:note, u:last change}.
// A cleared mark stays as {u} (a tombstone) so the clear syncs instead of the
// other device's copy bringing it back.
let S={};
try{ S=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ S={}; }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} Sync.queue(); };
const upd=e=>e?(e.u||e.t||0):-1;
function merge(a,b){            // per posting, the most recent change wins
  const out={...a};
  for(const id in b) if(upd(b[id])>upd(out[id])) out[id]=b[id];
  return out;
}

// --- sync: a secret GitHub gist holds the marks, so every device sees the same ones.
// Needs a fine-grained token with only the account permission "Gists: read and write".
// The repo is public, which is why the marks are not stored in it.
const Sync=(()=>{
  const K="jobwatch.sync.v1", DESC="jobwatch status (private)", FILE="jobwatch-status.json";
  let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(K)||"{}"); }catch(e){}
  const keep=()=>{ try{ localStorage.setItem(K,JSON.stringify(cfg)); }catch(e){} };
  let timer=null, busy=false, again=false;
  const show=t=>{ const el=document.querySelector("#syncst"); if(el) el.textContent=t;
    const b=document.querySelector("#sync"); if(b) b.textContent=cfg.token?"Stop syncing":"Sync across devices"; };
  const api=async(path,opt={})=>{
    const r=await fetch("https://api.github.com"+path,{...opt,headers:{
      "Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
    if(!r.ok) throw new Error(r.status===401?"token rejected":r.status===403||r.status===404?
      "token lacks Gists: read and write":"GitHub "+r.status);
    return r.json();
  };
  async function gist(){
    if(cfg.gist) return cfg.gist;
    for(let page=1; page<=5; page++){
      const list=await api(`/gists?per_page=100&page=${page}`);
      const g=list.find(x=>x.description===DESC);
      if(g){ cfg.gist=g.id; keep(); return g.id; }
      if(list.length<100) break;
    }
    const g=await api("/gists",{method:"POST",body:JSON.stringify({description:DESC,public:false,
      files:{[FILE]:{content:"{}"}}})});
    cfg.gist=g.id; keep(); return g.id;
  }
  async function remote(){
    const g=await api("/gists/"+await gist()), f=(g.files||{})[FILE];
    if(!f) return {};
    const txt=f.truncated?await (await fetch(f.raw_url)).text():f.content;
    try{ return JSON.parse(txt||"{}"); }catch(e){ return {}; }
  }
  // pull, merge, and write back only if this device had something newer
  async function run(){
    if(!cfg.token) return;
    if(busy){ again=true; return; }
    busy=true; show("syncing…");
    try{
      const r=await remote(), m=merge(S,r);
      const changed=JSON.stringify(m)!==JSON.stringify(S), behind=JSON.stringify(m)!==JSON.stringify(r);
      if(changed){ S=m; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(window.render) render(); }
      if(behind) await api("/gists/"+cfg.gist,{method:"PATCH",body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(m)}}})});
      show("synced "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
    }catch(e){ show("sync failed: "+e.message); }
    busy=false;
    if(again){ again=false; run(); }
  }
  return {
    on:()=>!!cfg.token,
    queue(){ if(!cfg.token) return; clearTimeout(timer); timer=setTimeout(run,1500); },
    run,
    toggle(){
      if(cfg.token){
        if(confirm("Stop syncing on this device? Marks stay here and in the gist.")){ cfg={}; keep(); show("sync off"); }
        return;
      }
      const t=prompt("Paste a GitHub fine-grained token with the account permission \"Gists: read and write\" (nothing else). It is stored only in this browser.");
      if(!t) return;
      cfg={token:t.trim()}; keep(); run();
    },
    init(){ show(cfg.token?"":"sync off"); }
  };
})();

let DATA={jobs:[],review:[],errors:[]}, VIEW="open";
const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=iso=>{ if(!iso) return null; const d=(Date.now()-new Date(iso).getTime())/864e5; return isFinite(d)?d:null; };
const st=id=>(S[id]||{}).s||null;
// age from when the posting went live; boards with no date fall back to when jobwatch first saw it
const ageOf=j=>{ const p=days(j.posted); return p!==null?p:days(j.first_seen); };
const fmtDay=iso=>{ const d=new Date(iso.length===10?iso+"T12:00:00Z":iso);
  return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:d.getFullYear()!==new Date().getFullYear()?"numeric":undefined}); };
const ago=d=>d===null?"":d<1?"today":d<2?"1 day ago":`${Math.floor(d)} days ago`;
const PREF="jobwatch.view.v1";
const fmtPay=v=>v>=100?Math.round(v):(Math.round(v*2)/2).toString().replace(/\.0$/,"");
const midPay=j=>j.score.rate?(j.score.rate[0]+j.score.rate[1])/2:-1;

function setStatus(id,v){
  const cur=st(id), now=Date.now(), n=(S[id]||{}).n;
  if(cur===v) S[id]=n?{n,u:now}:{u:now};
  else S[id]={...(S[id]||{}), s:v, t:now, u:now};
  save(); render();
}
function setNote(id,v){
  S[id]={...(S[id]||{}), n:v, u:Date.now()};
  if(!v) delete S[id].n;
  save();
}
window.setStatus=setStatus; window.setNote=setNote;

function counts(){
  const c={open:0,applied:0,saved:0,dismissed:0,review:(DATA.review||[]).length};
  (DATA.jobs||[]).forEach(j=>{ const s=st(j.id); c[s||"open"]=(c[s||"open"]||0)+1; });
  for(const k in c) $("#c-"+k).textContent = c[k] ? `(${c[k]})` : "";
}

function cardFor(j){
  const s=j.score, status=st(j.id), found=days(j.first_seen), posted=days(j.posted), isNew=found!==null&&found<2;
  const fr=s.fresh||0;
  const note=(S[j.id]||{}).n||"";
  const btn=(v,label)=>`<button class="${status===v?'on':''}" onclick="setStatus('${j.id}','${v}')">${label}</button>`;
  return `<div class="card ${status||''}">
    <div class="row1">
      <span class="tier t${s.tier}">${s.tier} · ${s.total}</span>
      <span class="title"><a href="${j.url}" target="_blank" rel="noopener">${esc(j.title)}</a></span>
      <span class="co">${esc(j.company)}</span>
      ${isNew&&!status?'<span class="new">NEW</span>':''}
    </div>
    <div class="sub">${esc(j.location||"location n/a")} ·
      ${s.rate?`<span class="pay">$${fmtPay(s.rate[0])}${s.rate[1]>s.rate[0]?`–${fmtPay(s.rate[1])}`:''}/hr</span> · `:'pay not stated · '}
      fit ${s.fit} / pay ${s.pay>0?'+':''}${s.pay??0} / loc ${s.loc} / trajectory ${s.traj}
      <span class="fr ${fr>0?'up':fr<0?'down':''}" title="freshness points in the ranking">freshness ${fr>0?'+':''}${fr}</span></div>
    <div class="dates">${posted!==null?`Posted <b>${fmtDay(j.posted)}</b> (${ago(posted)})`:'Posting date not given by the board'}
      ${found!==null?` · first picked up by jobwatch <b>${fmtDay(j.first_seen)}</b> (${ago(found)})`:''}
      ${j.season==="unstated"?' · <span title="The posting names no term or year; it went up this recruiting cycle, so it is probably Summer 2027. Check before applying.">term not stated</span>':''}</div>
    <div class="why">${s.why.map(w=>`<span class="w">${esc(w[0])} ${w[1]>0?'+':''}${w[1]}</span>`).join("")}</div>
    <div class="act">
      ${btn('applied','Applied')}${btn('saved','Save for later')}${btn('dismissed','Not relevant')}
      <input class="note" placeholder="note…" value="${esc(note)}"
             oninput="setNote('${j.id}', this.value)">
      ${status?`<span class="stamp">${status}${(S[j.id]||{}).t?` · ${new Date(S[j.id].t).toLocaleDateString()}`:''}</span>`:''}
    </div>
  </div>`;
}

function render(){
  counts();
  const q=$("#q").value.toLowerCase().trim();
  const showA=$("#fA").getAttribute("aria-pressed")==="true";
  const showB=$("#fB").getAttribute("aria-pressed")==="true";
  const showC=$("#fC").getAttribute("aria-pressed")==="true";
  const sort=$("#sort").value, maxAge=Number($("#age").value||0);
  try{ localStorage.setItem(PREF,JSON.stringify({sort, age:$("#age").value})); }catch(e){}

  if(VIEW==="review"){
    const r=(DATA.review||[]).filter(x=>!q||(x.title+" "+x.company+" "+x.location).toLowerCase().includes(q));
    $("#list").innerHTML = r.length ? r.map(x=>`
      <div class="card">
        <div class="row1">
          <span class="tier tC">review</span>
          <span class="title"><a href="${x.url}" target="_blank" rel="noopener">${esc(x.title)}</a></span>
          <span class="co">${esc(x.company)}</span>
        </div>
        <div class="sub">${esc(x.location||"location n/a")} · dropped: ${esc(x.reason)}</div>
      </div>`).join("") : '<div class="empty">review queue empty</div>';
    return;
  }

  let jobs=(DATA.jobs||[]).filter(j=>{
    const s=st(j.id);
    if(VIEW==="open"  && s) return false;
    if(VIEW!=="open"  && s!==VIEW) return false;
    if(j.score.tier==="A" && !showA) return false;
    if(j.score.tier==="B" && !showB) return false;
    if(j.score.tier==="C" && !showC) return false;
    if(maxAge){ const a=ageOf(j); if(a===null) return false;
      if(maxAge>0 ? a>maxAge : a<=-maxAge) return false; }
    if(!q) return true;
    return (j.title+" "+j.company+" "+j.location).toLowerCase().includes(q);
  });

  const base=j=>j.score.base??j.score.total, newest=k=>(a,b)=>(b[k]||"").localeCompare(a[k]||"");
  if(sort==="posted") jobs.sort((a,b)=>(ageOf(a)??1e9)-(ageOf(b)??1e9));
  else if(sort==="found") jobs.sort(newest("first_seen"));
  else if(sort==="fit") jobs.sort((a,b)=>base(b)-base(a));
  else if(sort==="pay") jobs.sort((a,b)=>midPay(b)-midPay(a)||b.score.total-a.score.total);
  else if(sort==="company") jobs.sort((a,b)=>a.company.localeCompare(b.company));
  else jobs.sort((a,b)=>b.score.total-a.score.total);

  $("#list").innerHTML = jobs.length ? jobs.map(cardFor).join("")
    : `<div class="empty">nothing in ${VIEW}</div>`;
}

$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  [...document.querySelectorAll(".tab")].forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  VIEW=t.dataset.view; render();
});
try{ const p=JSON.parse(localStorage.getItem(PREF)||"{}");
  if(p.sort) $("#sort").value=p.sort; if(p.age!==undefined) $("#age").value=p.age; }catch(e){}
["q","sort","age"].forEach(id=>$("#"+id).addEventListener("input",render));
["fA","fB","fC"].forEach(id=>$("#"+id).addEventListener("click",e=>{
  const el=e.currentTarget, v=el.getAttribute("aria-pressed")==="true";
  el.setAttribute("aria-pressed",String(!v)); render();
}));

$("#exp").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="jobwatch-status.json"; a.click();
});
$("#imp").addEventListener("click",()=>{
  const txt=prompt("Paste exported status JSON:");
  if(!txt) return;
  try{ S=merge(S,JSON.parse(txt)); save(); render(); }
  catch(e){ alert("Could not parse that JSON."); }
});
$("#clr").addEventListener("click",()=>{
  if(confirm("Clear every applied / saved / dismissed mark"+(Sync.on()?" on every synced device":"")+"?")){
    const now=Date.now(); for(const id in S) S[id]={u:now}; save(); render(); }
});
$("#sync").addEventListener("click",()=>Sync.toggle());
Sync.init();
// pick up marks made on other devices when this tab comes back into view
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") Sync.run(); });

// Every scan commits data.json to the repo, but GitHub Pages republishes slowly and
// sometimes refuses deploys outright. So read the committed copy from
// raw.githubusercontent.com (CORS-open, cached about 5 minutes) and fall back to
// the Pages copy; whichever was generated later wins.
function loadData(){
  const t="?t="+Date.now(), host=location.hostname, path=location.pathname.split("/").filter(Boolean);
  const raw=host.endsWith(".github.io")&&path.length
    ? `https://raw.githubusercontent.com/${host.split(".")[0]}/${path[0]}/main/docs/data.json${t}` : null;
  const get=u=>fetch(u).then(r=>r.ok?r.json():Promise.reject(r.status));
  return Promise.allSettled([raw?get(raw):Promise.reject("no raw"), get("data.json"+t)]).then(rs=>{
    const ok=rs.filter(r=>r.status==="fulfilled").map(r=>r.value);
    if(!ok.length) throw new Error("no data");
    return ok.sort((a,b)=>(b.generated||"").localeCompare(a.generated||""))[0];
  });
}
loadData().then(d=>{
  DATA=d;
  const when=d.generated?new Date(d.generated):null;
  $("#meta").textContent=`${(d.jobs||[]).length} live matches · ${d.scanned} postings scanned across `+
    `${d.boards} boards${when?` · updated ${when.toLocaleString()}`:""}`;
  // problems go in a banner at the top, not a collapsed footer
  const warn=[], hrs=when?(Date.now()-when.getTime())/36e5:null;
  if(hrs!==null && hrs>2)
    warn.push(`<b>Stale:</b> last scan was ${Math.round(hrs)} hours ago. Scheduled runs are not firing or are failing — check the Actions tab.`);
  if(d.errors&&d.errors.length){
    warn.push(`<b>${d.errors.length} of ${d.boards} boards failed</b> on the last scan, so their postings are missing: `+
      d.errors.map(e=>`${esc(e.company)} <span class="w">${esc(e.board)}</span> ${esc(e.error)}`).join(" · "));
    $("#errbox").innerHTML=`<summary>${d.errors.length} board error(s)</summary>`+
      d.errors.map(e=>`<div class="err">${esc(e.company)} (${esc(e.board)}): ${esc(e.error)}</div>`).join("");
  }
  if(warn.length && d.run_url) warn.push(`<a href="${esc(d.run_url)}" target="_blank" rel="noopener">Open the run log</a>`);
  $("#alert").innerHTML=warn.join("<br>");
  render(); Sync.run();
}).catch(()=>{ $("#meta").textContent="could not load data.json — run jobwatch/watch.py first"; });
</script>
</body></html>
