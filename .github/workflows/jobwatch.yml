name: jobwatch

on:
  schedule:
    # Backup only. GitHub drops most scheduled events (2-4 of 72 a day fire here), so
    # the real cadence comes from the `next` job below, which re-dispatches this
    # workflow 20 minutes after each run starts. The schedule restarts that chain if
    # it ever breaks. Off the hour on purpose: :00 events are dropped even more.
    - cron: "8,28,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write      # lets the `next` job start the following run

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # job-level so the `if:` on the drafting step can see it
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Discover new companies and probe new names (first run of each day)
        # GitHub drops most scheduled runs, so instead of a daily slot that may never
        # fire, every run asks discover.py whether 20 hours have passed (exit 3 = not due).
        # A failure here never blocks the scan.
        continue-on-error: true
        run: |
          set +e
          python jobwatch/discover.py --if-due
          rc=$?
          set -e
          [ "$rc" -eq 3 ] && exit 0
          [ "$rc" -eq 0 ] || exit "$rc"
          python jobwatch/resolve.py --limit 20

      - name: Scan boards
        # writes board errors to the job summary and as warnings; exits non-zero if
        # the scan is mostly broken, so the run goes red and GitHub emails you
        run: python jobwatch/watch.py --ci

      - name: Draft letters for new high scorers
        if: env.ANTHROPIC_API_KEY != ''
        run: python jobwatch/tailor.py --llm --new-only --min-score 55 --hours 2

      - name: Commit results
        run: |
          git config user.name  "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          git add docs/data.json jobwatch/seen.json jobwatch/resolved.json jobwatch/companies.txt
          [ -f jobwatch/discover_state.json ] && git add jobwatch/discover_state.json
          [ -d drafts ] && git add drafts
          git diff --staged --quiet && exit 0
          git commit -m "jobwatch: $(date -u +%F\ %H:%M) scan"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4

  # Start the next scan 20 minutes after this one started. GITHUB_TOKEN may trigger
  # workflow_dispatch (unlike most events), so the loop needs no external service.
  # Runs even if the scan failed, so one bad run does not end the chain; skips the
  # dispatch when another run is already queued or running, so a scheduled run that
  # does fire cannot fork a second chain. To pause the loop, set the repository
  # variable JOBWATCH_LOOP to "off" (Settings, Secrets and variables, Actions,
  # Variables) or disable the workflow.
  next:
    needs: [scan, deploy]
    if: always() && vars.JOBWATCH_LOOP != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait until 20 minutes after this run started, then dispatch the next
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions"
          start=$(gh api "$api/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          wait=$(( $(date -d "$start" +%s) + 1200 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "sleeping ${wait}s"; sleep "$wait"; fi
          others=$(gh api "$api/workflows/jobwatch.yml/runs?per_page=30" --jq \
            "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) |
              select(.status == \"queued\" or .status == \"in_progress\" or
                     .status == \"waiting\" or .status == \"pending\" or .status == \"requested\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "another run is already queued or running; not dispatching"
          else
            gh workflow run jobwatch.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}"
            echo "dispatched the next run"
          fi
